services:
  macd-monitor:
    image: gnuhhung317/macd-monitor-dashboard
    container_name: macd-monitor
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./monitor_config.json:/app/monitor_config.json
      - ./data:/app/data
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - macd-network

  signal-dashboard:
    image: gnuhhung317/macd-monitor-dashboard
    container_name: signal-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    command: streamlit run ml/signal_dashboard.py --server.port 8501 --server.address 0.0.0.0
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - PYTHONUNBUFFERED=1
    networks:
      - macd-network

networks:
  macd-network:
    driver: bridge
