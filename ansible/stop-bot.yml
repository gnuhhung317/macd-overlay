---
- name: Tắt (Stop) các bot đang chạy
  hosts: all_bots
  become: yes
  gather_facts: no

  tasks:
    - name: 1. Dừng Systemd Service của Bot
      systemd:
        name: "{{ bot_name }}"
        state: stopped
        enabled: no # Không cho tự chạy lại khi restart VPS
      ignore_errors: yes

    - name: 2. Kiểm tra lại chắc chắn đã tắt
      command: systemctl is-active {{ bot_name }}
      register: service_status
      ignore_errors: yes
      changed_when: false

    - name: 3. Thông báo
      debug:
        msg: "Bot {{ bot_name }} đã được TẮT thành công! (Trạng thái: {{ service_status.stdout }})"
